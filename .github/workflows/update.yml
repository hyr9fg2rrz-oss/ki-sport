name: Kalender aktualisieren
on:
  schedule:
    - cron: "17 4 * * *"   # täglich ca. 05:17 (Winter) / 06:17 (Sommer) Wiener Zeit
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python build.py .
      - run: |
          git config user.name "ki-sport-bot"
          git config user.email "ki-sport-bot@users.noreply.github.com"
          git add *.ics docs
          git diff --cached --quiet || git commit -m "Kalender aktualisiert $(date -u +%F)"
          git push
